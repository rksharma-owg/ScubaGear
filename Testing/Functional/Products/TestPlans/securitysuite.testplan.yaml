  - PolicyId: MS.SECURITYSUITE.6.1v1
    TestDriver: ScubaCached
    Tests:
      - TestDescription: MS.SECURITYSUITE.6.1v1 Non-Compliant case - All policies have SpamAction set to AddXHeader
        Preconditions:
          - Command: Set-AllHostedContentFilterPolicyProperty
            Splat:
              PropertyName: SpamAction
              Value: "AddXHeader"
          - Command: Set-AllProtectionPolicyRuleProperty
            Splat:
              PropertyName: State
              Value: "Disabled"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.SECURITYSUITE.6.1v1 Non-Compliant case - All policies have HighConfidenceSpamAction set to AddXHeader
        Preconditions:
          - Command: Set-AllHostedContentFilterPolicyProperty
            Splat:
              PropertyName: HighConfidenceSpamAction
              Value: "AddXHeader"
          - Command: Set-AllProtectionPolicyRuleProperty
            Splat:
              PropertyName: State
              Value: "Disabled"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.SECURITYSUITE.6.1v1 Non-Compliant case - All policies have PhishSpamAction set to AddXHeader
        Preconditions:
          - Command: Set-AllHostedContentFilterPolicyProperty
            Splat:
              PropertyName: PhishSpamAction
              Value: "AddXHeader"
          - Command: Set-AllProtectionPolicyRuleProperty
            Splat:
              PropertyName: State
              Value: "Disabled"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.SECURITYSUITE.6.1v1 Compliant case - All policies have compliant spam actions
        Preconditions:
          - Command: Set-AllHostedContentFilterPolicyProperty
            Splat:
              PropertyName: SpamAction
              Value: "MoveToJmf"
          - Command: Set-AllHostedContentFilterPolicyProperty
            Splat:
              PropertyName: HighConfidenceSpamAction
              Value: "MoveToJmf"
          - Command: Set-AllHostedContentFilterPolicyProperty
            Splat:
              PropertyName: PhishSpamAction
              Value: "Quarantine"
          - Command: Set-AllHostedContentFilterPolicyProperty
            Splat:
              PropertyName: HighConfidencePhishAction
              Value: "Quarantine"
        Postconditions: []
        ExpectedResult: true
      - TestDescription: MS.SECURITYSUITE.6.1v1 Non-Compliant case - Preset scoped to single recipient does not override non-compliant policies
        Preconditions:
          - Command: Set-AllHostedContentFilterPolicyProperty
            Splat:
              PropertyName: SpamAction
              Value: "AddXHeader"
          - Command: Set-AllProtectionPolicyRuleProperty
            Splat:
              PropertyName: State
              Value: "Enabled"
          - Command: Set-AllProtectionPolicyRuleProperty
            Splat:
              PropertyName: SentTo
              Value: ["user@example.com"]
        Postconditions: []
        ExpectedResult: false

